<h1>Advisors in Your Major</h1>

<hr>

{% for advisor in advisors %}

    <div style="margin-bottom: 15px;">
        <p>
            <strong>{{ advisor.username }}</strong>
        </p>

        <a href="{% url 'chat' advisor.id %}">
            Chat
        </a>
    </div>

{% empty %}

    <p>No advisors found.</p>

{% endfor %}
