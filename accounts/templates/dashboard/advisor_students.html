{% extends "base.html" %}

{% block content %}

<h1>My Students</h1>

{% if students %}

<table border="1">

    <tr>
        <th>Name</th>
        <th>Major</th>
        <th>GPA</th>
        <th>Actions</th>
    </tr>

    {% for student in students %}

    <tr>

        <td>
            {{ student.user.get_full_name }}
        </td>

        <td>
            {{ student.major }}
        </td>

        <td>
            {{ student.gpa }}
        </td>

        <td>
            <a href="{% url 'advisor_student_detail' student.id %}">
                View Profile
            </a>
        </td>

    </tr>

    {% endfor %}

</table>

{% else %}

<p>No students assigned to you.</p>

{% endif %}

{% endblock %}
