{% extends "base.html" %}

{% block content %}

<h1>Student Profile</h1>

<p>
    Full Name:
    {{ student.user.first_name }}
    {{ student.user.last_name }}
</p>

<p>
    Email:
    {{ student.user.email }}
</p>

<p>
    Major:
    {{ student.major }}
</p>

<p>
    GPA:
    {{ student.gpa }}
</p>

<a href="{% url 'dashboard' %}">
    Back
</a>

{% endblock %}
