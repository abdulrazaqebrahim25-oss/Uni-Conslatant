<!DOCTYPE html>
<html>
<head>
    <title>Chat</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
        }

        .header {
            padding: 15px;
            border-bottom: 1px solid #ddd;
            font-weight: bold;
        }

        .messages {
            height: 80vh;
            overflow-y: auto;
            padding: 15px;
            background: #f7f7f7;
        }

        .msg {
            margin: 8px 0;
            padding: 10px;
            background: white;
            border-radius: 10px;
            width: fit-content;
        }

        .me {
            background: #dcf8c6;
            margin-left: auto;
        }

        .input {
            display: flex;
            border-top: 1px solid #ddd;
        }

        .input input {
            flex: 1;
            padding: 12px;
        }

        .input button {
            padding: 12px;
        }
    </style>
</head>

<body>

<div class="header">
    Chat with {{ other_user.username }}
</div>

<div class="messages">

    {% for message in messages %}

        <div class="msg {% if message.sender == request.user %}me{% endif %}">
            {{ message.content }}
        </div>

    {% endfor %}

</div>

<form method="POST" class="input">
    {% csrf_token %}
    <input type="text" name="content" placeholder="Type a message...">
    <button>Send</button>
</form>

</body>
</html>
