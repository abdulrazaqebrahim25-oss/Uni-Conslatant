{% extends "base.html" %}

{% block content %}

<h1>Advisor Profile</h1>

<p>
    <strong>Name:</strong>
    {{ advisor.user.get_full_name }}
</p>

<p>
    <strong>Username:</strong>
    {{ advisor.user.username }}
</p>

<p>
    <strong>Email:</strong>
    {{ advisor.user.email }}
</p>

<p>
    <strong>Office:</strong>
    {{ advisor.office }}
</p>

<p>
    <strong>Major:</strong>
    {{ advisor.major }}
</p>

<a href="{% url 'edit_advisor_profile' %}">
    Edit Profile
</a>

{% endblock %}
