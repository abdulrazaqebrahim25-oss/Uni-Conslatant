{% extends "base.html" %}

{% block content %}

<div class="container py-5">

    <div class="card shadow-sm">

        <div class="card-body text-center">

            <h2 class="mb-4 text-danger">
                Delete Appointment
            </h2>

            <p>
                Are you sure you want to delete this appointment?
            </p>

            <p>
                <strong>
                    {{ appointment.start_time|date:"Y-m-d H:i" }}
                </strong>
            </p>

            <form method="POST">

                {% csrf_token %}

                <button type="submit"
                        class="btn btn-danger">

                    Yes, Delete

                </button>

                <a href="{% url 'student_appointments' %}"
                   class="btn btn-secondary">

                    Cancel

                </a>

            </form>

        </div>

    </div>

</div>

{% endblock %}
