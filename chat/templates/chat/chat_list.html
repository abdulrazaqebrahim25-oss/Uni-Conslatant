<!DOCTYPE html>
<html>
<head>
    <title>Chat</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            display: flex;
            height: 100vh;
        }

        /* LEFT PANEL */
        .sidebar {
            width: 30%;
            border-right: 1px solid #ddd;
            overflow-y: auto;
        }

        .chat-item {
            padding: 15px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
        }

        .chat-item:hover {
            background: #f5f5f5;
        }

        /* RIGHT PANEL */
        .chat-box {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .chat-header {
            padding: 15px;
            border-bottom: 1px solid #ddd;
            font-weight: bold;
        }

        .messages {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            background: #fafafa;
        }

        .msg {
            margin: 5px 0;
            padding: 8px 12px;
            background: white;
            display: inline-block;
            border-radius: 10px;
        }

        .input-box {
            display: flex;
            padding: 10px;
            border-top: 1px solid #ddd;
        }

        .input-box input {
            flex: 1;
            padding: 10px;
        }

        .input-box button {
            padding: 10px;
        }
    </style>
</head>

<body>

<!-- LEFT -->
<div class="sidebar">

    <h3 style="padding:10px;">Chats</h3>

    {% for chat in chats %}

        <a href="{% url 'chat' chat.user.id %}" style="text-decoration:none; color:black;">

            <div class="chat-item">
                <strong>{{ chat.user.username }}</strong><br>
                <small>{{ chat.last_message }}</small>
            </div>

        </a>

    {% empty %}

        <p style="padding:10px;">No chats yet</p>

    {% endfor %}

</div>

<!-- RIGHT -->
<div class="chat-box">

    <div class="chat-header">
        Select a chat
    </div>

    <div class="messages">
        <p>Open a chat to start messaging</p>
    </div>

</div>

</body>
</html>
