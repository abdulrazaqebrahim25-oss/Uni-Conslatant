<h2>Chats</h2>

<a href="{% url 'home' %}">⬅ Back</a>

<hr>

{% for chat in chats %}

    <div style="padding:10px; border-bottom:1px solid #ddd;">
        
        <a href="{% url 'chat' chat.user.id %}">
            <strong>{{ chat.user.username }}</strong>
        </a>

        <p>{{ chat.last_message }}</p>
        <small>{{ chat.time }}</small>

    </div>

{% empty %}
    <p>No chats yet</p>
{% endfor %}
