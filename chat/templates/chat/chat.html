<h2>Chat with {{ other_user.username }}</h2>

<a href="{% url 'chat_list' %}">⬅ Back</a>

<hr>

<div id="chat-box"
     style="height:400px; overflow-y:scroll; border:1px solid #ddd; padding:10px;">
</div>

<form method="POST">
    {% csrf_token %}
    <input type="text" name="content" placeholder="Type message..." style="width:80%;">
    <button type="submit">Send</button>
</form>

<script>
const userId = "{{ other_user.id }}";

function loadMessages() {
    fetch(`/chat/fetch/${userId}/`)
        .then(res => res.json())
        .then(data => {
            let box = document.getElementById("chat-box");
            box.innerHTML = "";

            data.messages.forEach(m => {
                box.innerHTML += `
                    <div style="text-align:${m.mine ? 'right' : 'left'}; margin:6px;">
                        <span style="display:inline-block; padding:8px; border-radius:10px; background:#eee;">
                            ${m.content}
                        </span>
                    </div>
                `;
            });

            box.scrollTop = box.scrollHeight;
        });
}

loadMessages();
setInterval(loadMessages, 1000);
</script>
